<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Login</title>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">

    <div class="container">
        <div class="login-card shadow">

            <h2 class="text-center text-primary">Alke Wallet</h2>
            <p class="text-center text-muted">Accede a tu billetera digital</p>
            <p class="text-center text-secondary">Gestiona tus finanzas de forma rápida y segura.</p>

            <div id="mensajeLogin"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="Ingrese su correo">
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña">
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Iniciar sesión
                </button>

            </form>

            <small class="text-muted d-block text-center mt-3">
                Usuario: paola@wallet.com | Clave: 1234
            </small>
            
        </div>
             <small class="text-center text-muted d-block mt-4">
                © 2026 Alke Wallet - Desarrollado por Paola Orellana Lagos
            </small>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/script.js"></script>

  
</body>
</html>
